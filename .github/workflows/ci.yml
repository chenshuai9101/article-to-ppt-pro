name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          pip install --quiet python-pptx beautifulsoup4 requests
      - name: Compile all Python sources
        run: |
          set -e
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile
      - name: Run Python tests
        run: python tests/test_article_to_ppt.py
      - name: Node smoke
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund --silent; fi
